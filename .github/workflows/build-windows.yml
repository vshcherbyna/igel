name: Igel Windows Build with CMake

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:  # Allow manual triggering of the workflow

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ windows-latest ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Configure CMake
      run: cmake -DUSE_AVX2=1 -D_BTYPE=1 -DSYZYGY_SUPPORT=TRUE .

    - name: Build the project
      run: cmake --build . --config Release

    - name: Run the bench
      run: igel.exe bench
      working-directory: Release
      shell: cmd

    - name: Configure CMake for FRC
      run: cmake -DFRC=ON -DUSE_AVX2=1 -D_BTYPE=1 -DSYZYGY_SUPPORT=TRUE .

    - name: Build the FRC project
      run: cmake --build . --config Release

    - name: Run the FRC bench
      run: igel.exe bench
      working-directory: Release
      shell: cmd

    - name: Configure CMake for HCE
      run: cmake -DPURE_HCE=1 -DUSE_AVX2=1 -D_BTYPE=1 -DSYZYGY_SUPPORT=TRUE .

    - name: Build the HCE project
      run: cmake --build . --config Release

    - name: Run the HCE bench
      run: igel.exe bench
      working-directory: Release
      shell: cmd

  avx512:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Configure CMake for AVX512 and VNNI512
      run: cmake -DUSE_AVX2=1 -DUSE_AVX512=1 -DUSE_VNNI=1 -D_BTYPE=1 -DSYZYGY_SUPPORT=TRUE .

    # Build only, deliberately no bench - see the note in build-linux.yml.
    - name: Build the AVX512 project
      run: cmake --build . --config Release
