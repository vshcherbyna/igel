name: Igel Linux Build PGO Clang

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:  # Allow manual triggering of the workflow

jobs:
  build:
    # Pinned, not ubuntu-latest. The makefile drives clang-19 by name, and once
    # ubuntu-latest began moving to Ubuntu 26 (2026-10-19) the apt.llvm.org
    # install of clang-19 failed with apt exit 100. Ubuntu 24.04 carries the
    # whole clang-19 toolchain in its own archive, so no third-party repository
    # is needed. Move this pin and the makefile's CLANG* names together.
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Clang 19 toolchain
      run: |
        # clang-19 + lld-19 + llvm-19 (llvm-profdata-19) + the compiler-rt
        # instrumentation runtime (libclang-rt-19-dev) needed by -fprofile-generate
        sudo apt-get update
        sudo apt-get install -y clang-19 lld-19 llvm-19 libclang-rt-19-dev

    - name: Run make pgo
      run: cd src&&make pgo

    - name: Run the bench
      run: cd src&&./igel bench

    - name: Run make pgo frc
      run: cd src&&make pgo frc EXE=igel-frc

    - name: Run the FRC bench
      run: cd src&&./igel-frc bench

    - name: Run make pgo_hce
      run: cd src&&make pgo_hce EXE=igel-hce

    - name: Run the HCE bench
      run: cd src&&./igel-hce bench
